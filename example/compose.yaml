name: redislock-example

# 三个独立 Redis 实例供 Redlock 演示使用，不配置主从或 Redis Cluster。
# 本地运行可以演示算法，但同一主机上的容器不具有生产环境的独立故障域。
x-redis: &redis
  image: redis:7
  command: ["redis-server", "--save", "", "--appendonly", "no"]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 1s
    timeout: 1s
    retries: 20

services:
  redis1:
    <<: *redis
    ports:
      - "127.0.0.1:${REDIS1_PORT:-16379}:6379"
  redis2:
    <<: *redis
    ports:
      - "127.0.0.1:${REDIS2_PORT:-16380}:6379"
  redis3:
    <<: *redis
    ports:
      - "127.0.0.1:${REDIS3_PORT:-16381}:6379"
